version: '3.8'

services:
  app:
    build: .
    container_name: plutos-exchange
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./public:/app/public
      - ./views:/app/views
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
